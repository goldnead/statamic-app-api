<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #3B1C7A 0%, #1F0F45 55%, #070512 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #DDD6FE; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #22D3EE; box-shadow: 0 0 18px #22D3EE; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#C4B5FD,#67E8F9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #E4E1F5; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #DDD6FE; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #0891B247, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">App API</span></h1>
      <p class="sub">A JSON layer for single-page apps over Sanctum.</p>
      <div class="badges">
        <span class="badge">Sanctum auth</span>
        <span class="badge">Teams &amp; access</span>
        <span class="badge">Checkout</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7C3AED"/><stop offset="1" stop-color="#0891B2"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1040" flood-opacity="0.36"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- braces around one endpoint, see icon.svg -->
        <g filter="url(#sh)" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
          <path d="M198 108 C158 108 146 126 146 162 V216 C146 242 132 256 102 256 C132 256 146 270 146 296 V350 C146 386 158 404 198 404"/>
          <path d="M314 108 C354 108 366 126 366 162 V216 C366 242 380 256 410 256 C380 256 366 270 366 296 V350 C366 386 354 404 314 404"/>
        </g>
        <circle cx="256" cy="256" r="32" fill="#FFFFFF" filter="url(#sh)"/>
      </svg>
    </div>
  </div>
</body>
</html>
