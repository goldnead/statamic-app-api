<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1040" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- A pair of curly braces around one point: a JSON object, and the
       endpoint that hands it to the app. The braces alone would say "code";
       the dot in the middle is the single door the SPA talks through.

       Violet into cyan, across the wheel rather than light into dark, because
       both hues on their own are taken (Payments, Booking) and this addon is
       the layer between the others and the app. -->
  <g filter="url(#sh)" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M198 108 C158 108 146 126 146 162 V216 C146 242 132 256 102 256 C132 256 146 270 146 296 V350 C146 386 158 404 198 404"/>
    <path d="M314 108 C354 108 366 126 366 162 V216 C366 242 380 256 410 256 C380 256 366 270 366 296 V350 C366 386 354 404 314 404"/>
  </g>
  <circle cx="256" cy="256" r="32" fill="#FFFFFF" filter="url(#sh)"/>
</svg>
