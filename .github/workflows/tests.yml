# Covers the four things the reference analysis found missing most often:
#   1. a real matrix across the range composer.json promises
#   2. the studio's addon-lint as a hard gate
#   3. Pint as a check, not an auto-commit
#   4. a rebuild of committed dist/ that fails on drift

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# statamic-accounts and statamic-teams (dev dependencies, the siblings the
# suite runs against) are not on Packagist yet. Each job points Composer at
# their GitHub repositories before installing; composer.json itself stays
# free of custom repositories, which a buyer's install could not resolve.
# Remove the step once both are published.
env:
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # Statamic 6 requires laravel/framework ^12.40 || ^13.0.
        laravel: ['^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - php: '8.2'
            laravel: '^13.0'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Siblings from GitHub
        run: |
          composer config repositories.accounts vcs https://github.com/goldnead/statamic-accounts
          composer config repositories.teams vcs https://github.com/goldnead/statamic-teams

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    name: Code style

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: |
          composer config repositories.accounts vcs https://github.com/goldnead/statamic-accounts
          composer config repositories.teams vcs https://github.com/goldnead/statamic-teams

      - run: composer install --prefer-dist --no-interaction

      # Check, never fix.
      - run: vendor/bin/pint --test

  standards:
    runs-on: ubuntu-latest
    name: Addon standards

    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
          # release.versioning reads the repository's tags.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: goldnead/statamic-addon-studio
          path: studio

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run addon-lint
        run: php studio/tools/addon-lint/bin/addon-lint addon --no-color --fail-on=major -v

  analyse:
    runs-on: ubuntu-latest
    name: Static analysis

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: |
          composer config repositories.accounts vcs https://github.com/goldnead/statamic-accounts
          composer config repositories.teams vcs https://github.com/goldnead/statamic-teams

      - run: composer install --prefer-dist --no-interaction

      - run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  dist:
    runs-on: ubuntu-latest
    name: Built assets are current

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: |
          composer config repositories.accounts vcs https://github.com/goldnead/statamic-accounts
          composer config repositories.teams vcs https://github.com/goldnead/statamic-teams

      # `@statamic/cms` is installed from the vendor directory, so Composer has
      # to run before npm.
      - run: composer install --prefer-dist --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run build

      # The committed bundle is what every installed site loads.
      - name: Fail if dist/ differs from the sources
        run: git diff --exit-code dist
